<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Rentas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="panel-supervisores">
            <h2>PROGRAMA CONTROL TIEMPO RENT</h2>
        </div>

        <section class="seccion-inicio">
            <h3>Seleccionar Carro:</h3>
        
<div class="opciones-vehiculos">
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Maqueen')">Maqueen</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Jeep verde')">Jeep verde</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Jeep Frozen')">Jeep Frozen</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Moto grande')">Moto grande</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Moto azul')">Moto azul</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Moto rosa')">Moto rosa</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Beetle')">Beetle</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Tri azul')">Tri azul</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Tri roja')">Tri roja</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Tri blanca')">Tri blanca</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Cuatri gris')">Cuatri gris</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Cuatri roja')">Cuatri roja</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Bici azul')">Bici azul</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Bici grande')">Bici grande</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Bici grande rosa')">Bici grande rosa</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Bici negra')">Bici negra</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Bici nueva')">Bici nueva</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Carrito empujar gris')">Carrito empujar gris</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Carrito empujar Rojo')">Carrito empujar Rojo</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Carrito empujar Rojo chico')">Carrito empujar Rojo chico</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Carrito empujar Blanco')">Carrito empujar Blanco</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Carrito empujar Rojo nuevo')">Carrito empujar Rojo nuevo</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Camioneta grande')">Camioneta grande</button>
                <button type="button" class="btn-opcion" onclick="seleccionarVehiculo(this, 'Motito')">Motito</button>
            </div>
        
            <button type="button" class="btn-accion-grande" id="btn-iniciar" onclick="iniciarRenta()">INICIAR</button>
        </section>

        <section class="seccion-rentas">
            <div id="listaRentasActivas">
                </div>
        </section>

        <section class="seccion-resumen">
            <div class="encabezado-resumen">
                <h3 class="panel-supervisores">Rentas del día:</h3>
                <button onclick="borrarRegistroDiario()" class="btn-limpiar">Limpiar día</button>
            </div>
            <div id="tablaRentasDiarias">
                </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
